<style>
        /* Custom soft shadow as per brand guidelines */
        .modal-shadow {
            box-shadow: 0 12px 40px -12px rgba(0, 0, 0, 0.15);

<body class="bg-surface-dim min-h-screen flex items-center justify-center p-lg md:p-section-v-pad-desktop font-body text-body text-text-body antialiased">
<!-- Modal Container -->
<div class="relative w-full max-w-[480px] bg-surface rounded-[16px] modal-shadow p-xl border border-border">
<!-- Close Button -->
<button aria-label="Close modal" class="absolute top-md right-md p-xs text-text-muted hover:text-text-strong hover:bg-bg-stone rounded-full transition-colors flex items-center justify-center min-h-[44px] min-w-[44px]" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<!-- Header -->
<div class="mb-lg pr-xl">
<h3 class="font-h3-mobile text-h3-mobile md:font-h3-desktop md:text-h3-desktop text-text-strong mb-sm">Join the Kira waitlist.</h3>
<p class="font-body text-body text-text-muted">Get priority access when we open beta. We'll only email you about Kira — never spam, never sold.</p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-md" method="POST">
<!-- Field 1: Email -->
<div class="flex flex-col gap-[6px]">
<label class="font-mono-label text-mono-label text-text-strong" for="email">Email address <span class="text-error">*</span></label>
<input class="w-full min-h-[44px] px-sm py-[10px] bg-surface border border-border rounded-lg font-body text-body text-text-strong placeholder:text-text-muted/60 focus:outline-none focus:ring-2 focus:ring-amber-700 focus:border-amber-700 transition-shadow" id="email" name="email" placeholder="you@yourbakery.com" required="" type="email"/>
</div>
<!-- Field 2: Business Name -->
<div class="flex flex-col gap-[6px]">
<label class="font-mono-label text-mono-label text-text-strong" for="businessName">Business name <span class="text-error">*</span></label>
<input class="w-full min-h-[44px] px-sm py-[10px] bg-surface border border-border rounded-lg font-body text-body text-text-strong placeholder:text-text-muted/60 focus:outline-none focus:ring-2 focus:ring-amber-700 focus:border-amber-700 transition-shadow" id="businessName" name="businessName" placeholder="Roti Sedap Sdn Bhd" required="" type="text"/>
</div>
<!-- Field 3: Business Type -->
<div class="flex flex-col gap-[6px]">
<label class="font-mono-label text-mono-label text-text-strong" for="businessType">Business type <span class="text-error">*</span></label>
<div class="relative">
<select class="w-full min-h-[44px] pl-sm pr-xl py-[10px] bg-surface border border-border rounded-lg font-body text-body text-text-strong appearance-none focus:outline-none focus:ring-2 focus:ring-amber-700 focus:border-amber-700 transition-shadow bg-none" id="businessType" name="businessType" required="">
<option class="text-text-muted" disabled="" selected="" value="">Select an option</option>
<option value="bakery">Bakery</option>
<option value="cafe">Cafe</option>
<option value="casual_restaurant">Casual restaurant</option>
<option value="kuih_home_baker">Kuih / home baker</option>
<option value="other_fb">Other F&amp;B</option>
<option value="not_fb">Not F&amp;B</option>
</select>
<!-- Custom Arrow for Select -->
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-sm text-text-muted">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">expand_more</span>
</div>
</div>
</div>
<!-- Field 4: Checkbox -->
<div class="flex items-start gap-sm mt-xs">
<div class="flex items-center min-h-[44px]">
<input class="w-5 h-5 rounded-[4px] border-border text-amber-700 focus:ring-amber-700 focus:ring-offset-0 bg-surface cursor-pointer mt-[-2px]" id="interview" name="interview" type="checkbox"/>
</div>
<label class="font-body-sm text-body-sm text-text-body cursor-pointer pt-[12px] pb-[10px]" for="interview">
                    I'm happy to be interviewed for 20 minutes to help shape Kira
                </label>
</div>
<!-- Submit Button -->
<div class="mt-sm pt-xs border-t border-border/50">
<button class="w-full min-h-[44px] py-[16px] px-[24px] bg-amber-700 hover:bg-amber-600 text-on-primary font-h4 text-h4 rounded-[12px] transition-colors flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-amber-700 focus:ring-offset-2 focus:ring-offset-surface" type="submit">
                    Join the Waitlist
                </button>
</div>
</form>
