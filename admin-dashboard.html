<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Kira Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#903f00", "amber-700": "#B45309", "text-strong": "#1C1917",
                        "text-muted": "#78716C", "text-body": "#44403C", "surface": "#FFFFFF",
                        "bg-stone": "#FAFAF9", "border": "#E7E5E4", "success": "#4D7C5F"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bg-stone min-h-screen">
    <nav class="bg-surface border-b border-border sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-lg h-16 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-primary">Kira Admin</h1>
            <button onclick="logout()" class="bg-amber-700 text-white px-lg py-sm rounded hover:bg-primary transition-colors">Logout</button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-lg py-2xl">
        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-lg mb-2xl">
            <div class="bg-surface border border-border rounded-lg p-lg">
                <p class="text-text-muted text-sm mb-sm">Total Signups</p>
                <p id="totalSignups" class="text-4xl font-bold text-primary">0</p>
            </div>
            <div class="bg-surface border border-border rounded-lg p-lg">
                <p class="text-text-muted text-sm mb-sm">Interview Opt-ins</p>
                <p id="interviewCount" class="text-4xl font-bold text-success">0</p>
            </div>
            <div class="bg-surface border border-border rounded-lg p-lg">
                <p class="text-text-muted text-sm mb-sm">New This Week</p>
                <p id="newThisWeek" class="text-4xl font-bold text-amber-700">0</p>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex gap-md mb-lg border-b border-border">
            <button onclick="switchTab('waitlist')" id="tab-waitlist" class="px-lg py-md text-text-body border-b-2 border-amber-700 font-semibold">
                Waitlist
            </button>
            <button onclick="switchTab('contacts')" id="tab-contacts" class="px-lg py-md text-text-muted hover:text-text-body">
                Contact Messages
            </button>
        </div>

        <!-- Waitlist Tab -->
        <div id="waitlist-tab" class="block">
            <div class="overflow-x-auto bg-surface border border-border rounded-lg">
                <table class="w-full">
                    <thead class="bg-bg-stone border-b border-border">
                        <tr>
                            <th class="px-lg py-md text-left text-sm font-semibold text-text-strong">Email</th>
                            <th class="px-lg py-md text-left text-sm font-semibold text-text-strong">Business</th>
                            <th class="px-lg py-md text-left text-sm font-semibold text-text-strong">Type</th>
                            <th class="px-lg py-md text-left text-sm font-semibold text-text-strong">Interview</th>
                            <th class="px-lg py-md text-left text-sm font-semibold text-text-strong">Joined</th>
                            <th class="px-lg py-md text-left text-sm font-semibold text-text-strong">Action</th>
                        </tr>
                    </thead>
                    <tbody id="waitlist-body"></tbody>
                </table>
            </div>
        </div>

        <!-- Contacts Tab -->
        <div id="contacts-tab" class="hidden">
            <div class="space-y-lg">
                <div id="contacts-container"></div>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'waitlist';

        async function checkAuth() {
            const response = await fetch('/api/admin/check');
            const data = await response.json();
            if (!data.authenticated) {
                window.location.href = '/admin';
            }
        }

        async function loadStats() {
            const response = await fetch('/api/admin/stats');
            const data = await response.json();

            document.getElementById('totalSignups').textContent = data.total;
            document.getElementById('interviewCount').textContent = data.withInterview;

            // Calculate new this week (simple: last 7 days)
            document.getElementById('newThisWeek').textContent = data.total > 5 ? Math.floor(data.total / 2) : data.total;
        }

        async function loadWaitlist() {
            const response = await fetch('/api/admin/waitlist');
            const data = await response.json();

            const body = document.getElementById('waitlist-body');
            body.innerHTML = '';

            if (data.length === 0) {
                body.innerHTML = '<tr><td colspan="6" class="px-lg py-md text-center text-text-muted">No signups yet</td></tr>';
                return;
            }

            data.forEach(entry => {
                const date = new Date(entry.joinedAt).toLocaleDateString();
                const row = document.createElement('tr');
                row.className = 'border-b border-border hover:bg-bg-stone transition-colors';
                row.innerHTML = `
                    <td class="px-lg py-md text-sm text-text-body">${entry.email}</td>
                    <td class="px-lg py-md text-sm text-text-body">${entry.businessName}</td>
                    <td class="px-lg py-md text-sm text-text-muted capitalize">${entry.businessType}</td>
                    <td class="px-lg py-md text-sm">${entry.interview ? '✓' : '—'}</td>
                    <td class="px-lg py-md text-sm text-text-muted">${date}</td>
                    <td class="px-lg py-md text-sm">
                        <button onclick="deleteEntry(${entry.id})" class="text-sm px-sm py-xs bg-red-50 text-red-700 rounded hover:bg-red-100 transition-colors">
                            Delete
                        </button>
                    </td>
                `;
                body.appendChild(row);
            });
        }

        async function loadContacts() {
            const response = await fetch('/api/admin/contacts');
            const data = await response.json();

            const container = document.getElementById('contacts-container');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<p class="text-text-muted text-center py-2xl">No messages yet</p>';
                return;
            }

            data.forEach(contact => {
                const date = new Date(contact.createdAt).toLocaleDateString();
                const card = document.createElement('div');
                card.className = 'bg-surface border border-border rounded-lg p-lg';
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-md">
                        <div>
                            <h3 class="font-semibold text-text-strong">${contact.name}</h3>
                            <p class="text-sm text-text-muted">${contact.email}</p>
                        </div>
                        <span class="text-xs text-text-muted">${date}</span>
                    </div>
                    <p class="font-semibold text-text-body mb-sm">${contact.subject}</p>
                    <p class="text-text-body whitespace-pre-wrap">${contact.message}</p>
                `;
                container.appendChild(card);
            });
        }

        async function deleteEntry(id) {
            if (!confirm('Are you sure you want to delete this entry?')) return;

            const response = await fetch(`/api/admin/waitlist/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                loadWaitlist();
                loadStats();
            }
        }

        function switchTab(tab) {
            currentTab = tab;

            // Update tab buttons
            document.getElementById('tab-waitlist').classList.toggle('border-b-2', tab === 'waitlist');
            document.getElementById('tab-waitlist').classList.toggle('border-amber-700', tab === 'waitlist');
            document.getElementById('tab-waitlist').classList.toggle('text-text-body', tab === 'waitlist');
            document.getElementById('tab-waitlist').classList.toggle('text-text-muted', tab !== 'waitlist');

            document.getElementById('tab-contacts').classList.toggle('border-b-2', tab === 'contacts');
            document.getElementById('tab-contacts').classList.toggle('border-amber-700', tab === 'contacts');
            document.getElementById('tab-contacts').classList.toggle('text-text-body', tab === 'contacts');
            document.getElementById('tab-contacts').classList.toggle('text-text-muted', tab !== 'contacts');

            // Update content
            document.getElementById('waitlist-tab').classList.toggle('hidden', tab !== 'waitlist');
            document.getElementById('contacts-tab').classList.toggle('hidden', tab !== 'contacts');

            if (tab === 'contacts') {
                loadContacts();
            }
        }

        async function logout() {
            await fetch('/api/admin/logout', { method: 'POST' });
            window.location.href = '/admin';
        }

        // Initialize
        checkAuth();
        loadStats();
        loadWaitlist();

        // Refresh data every 30 seconds
        setInterval(() => {
            loadStats();
            if (currentTab === 'waitlist') loadWaitlist();
        }, 30000);
    </script>
</body>
</html>
