<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Kira Admin - Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#903f00", "amber-700": "#B45309", "text-strong": "#1C1917",
                        "text-muted": "#78716C", "text-body": "#44403C", "surface": "#FFFFFF",
                        "bg-stone": "#FAFAF9", "border": "#E7E5E4", "error": "#ba1a1a"
                    },
                    "borderRadius": {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem"},
                    "spacing": {"md": "16px", "lg": "24px", "xl": "32px", "sm": "12px"}
                }
            }
        }
    </script>
</head>
<body class="bg-bg-stone min-h-screen flex items-center justify-center p-lg">
    <div class="bg-surface border border-border rounded-xl p-2xl w-full max-w-[400px]">
        <h2 class="text-2xl font-bold text-text-strong mb-md text-center">Kira Admin</h2>
        <p class="text-text-muted text-center mb-2xl">Sign in to access the dashboard</p>

        <form onsubmit="handleLogin(event)">
            <div class="flex flex-col gap-md mb-lg">
                <div>
                    <label class="block text-sm font-semibold text-text-strong mb-sm">Username</label>
                    <input type="text" id="username" placeholder="admin" class="w-full px-md py-sm border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-700" required/>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-text-strong mb-sm">Password</label>
                    <input type="password" id="password" placeholder="••••••••" class="w-full px-md py-sm border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-700" required/>
                </div>
            </div>

            <button type="submit" class="w-full bg-amber-700 text-white font-semibold py-sm rounded-lg hover:bg-primary transition-colors mb-md">Sign In</button>

            <div id="error" class="text-error text-sm text-center hidden"></div>
        </form>

        <div class="mt-lg p-md bg-bg-stone rounded border border-border">
            <p class="text-xs text-text-muted text-center"><strong>Demo Credentials:</strong><br>Username: admin<br>Password: admin123</p>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    errorDiv.textContent = data.error;
                    errorDiv.classList.remove('hidden');
                    return;
                }

                window.location.href = '/admin/dashboard';
            } catch (error) {
                errorDiv.textContent = 'Error: ' + error.message;
                errorDiv.classList.remove('hidden');
            }
        }

        // Check if already logged in
        fetch('/api/admin/check')
            .then(res => res.json())
            .then(data => {
                if (data.authenticated) {
                    window.location.href = '/admin/dashboard';
                }
            });
    </script>
</body>
</html>
